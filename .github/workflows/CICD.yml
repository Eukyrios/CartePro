name: CI

on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    branches-ignore:
      - "ga-ignore-*"

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-SVR-500-PAR-5-1-survivor-7.git"

jobs:
  frontend:
    name: Build frontend and publish the artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `output: "standalone"` writes the server plus only the node_modules it
      # traced, but deliberately leaves out .next/static and public — Next
      # expects a CDN to serve those, so a runnable bundle has to add them back.
      - name: Assemble the runnable bundle
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/ticket-tout"
          mkdir -p "$BUNDLE"
          cp -r .next/standalone/. "$BUNDLE"/
          cp -r .next/static "$BUNDLE"/.next/static
          cp -r public "$BUNDLE"/public
          cp ../.github/artifact/RUN.md "$BUNDLE"/RUN.md
          # Stamp the commit the bundle was built from, so the download can be
          # matched to a revision without reading the run.
          printf '\n---\n\nCommit `%s` — construit le %s.\n' \
            "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$BUNDLE"/RUN.md
          node -e "require('fs').accessSync('$BUNDLE/server.js')"
          du -sh "$BUNDLE"

      # The bundle is what gets demonstrated, so it is published from every
      # build: an artifact only exists on the run that uploaded it.
      - name: Publish the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket-tout-app
          # Absolute: the job's working-directory applies to `run` steps only.
          path: ${{ runner.temp }}/ticket-tout
          if-no-files-found: error
          retention-days: 30

  mirror:
    if: github.repository == 'Eukyrios/CartePro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Epitech repo
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
