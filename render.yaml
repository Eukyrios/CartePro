services:
  # La base de données PostgreSQL
  - type: pgo
    name: cartepro-postgres
    databaseName: cartepro
    user: postgres
    plan: free

  # Le backend Flask
  - type: web
    name: cartepro-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      # On lie la base de données au backend (Render remplit la variable automatiquement)
      - key: AUDIT_DB_SUPERUSER_URI
        fromDatabase:
          name: cartepro-postgres
          property: connectionString
      # On passe la même connexion à l'application principale
      - key: TICKET_TOUT_DATABASE_URI
        fromDatabase:
          name: cartepro-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: AUDIT_EXPORT_HMAC_KEY
        generateValue: true
