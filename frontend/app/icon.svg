<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CartePro">
  <!--
    Le favicon : le monogramme CartePro en blanc sur une tuile violette.

    Blanc sur violet, et non violet sur transparence : un favicon se pose sur
    une barre d'onglets dont la couleur appartient au navigateur, et #4a1b6b
    disparaît sur une barre sombre. La tuile fixe le contraste à toutes les
    tailles qu'on lui demande — 11,3:1 en clair, 7,2:1 sur la variante sombre.

    La carte fait 112x80 et l'icône est carrée : le tracé est ramené à 96 de
    large, centré, le reste en marge. Le C et la puce tiennent jusqu'à 16px —
    la puce s'y réduit à un point, mais la carte et son C restent lus.

    Même géométrie que public/logo/mark-purple.svg et que
    components/brand/VectorMark.tsx : les trois se retouchent ensemble.
  -->
  <style>
    .tuile { fill: #4a1b6b }
    @media (prefers-color-scheme: dark) {
      .tuile { fill: #6b2a99 }
    }
  </style>
  <rect class="tuile" width="128" height="128"/>
  <path fill="#ffffff" fill-rule="evenodd"
        transform="translate(16 29.71) scale(0.857)"
        d="M13 0 H99 A13 13 0 0 1 112 13 V67 A13 13 0 0 1 99 80 H13 A13 13 0 0 1 0 67 V13 A13 13 0 0 1 13 0 Z
           M58.36 19.32 A27 27 0 1 0 58.36 60.68 L49.03 49.57 A12.5 12.5 0 1 1 49.03 30.43 Z
           M83 31 H97 A3 3 0 0 1 100 34 V46 A3 3 0 0 1 97 49 H83 A3 3 0 0 1 80 46 V34 A3 3 0 0 1 83 31 Z"/>
</svg>
