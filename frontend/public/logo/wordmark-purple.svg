    Le logotype CartePro : le nom, et rien d'autre.

    « Carte » en Archivo 700, « Pro » en Archivo 400 — une seule encre, deux
    graisses. C'est le logotype composé de components/brand/Logotype.tsx,
    vectorisé : mêmes fontes, même approche de -0,02em, mêmes contours. Les
    lettres sont ici des tracés et non du texte, parce qu'un fichier SVG ne peut
    pas compter sur Archivo d'être installée chez celui qui l'ouvre.

    Régénéré depuis frontend/public/fonts/Archivo-{700,400}-normal-latin.woff2
    avec fontTools — voir le commit qui l'a produit. Le `viewBox` est calé au
    plus juste sur les lettres, débord des rondes compris, pour que le logotype
    remplisse sa boîte.
