<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CartePro"
     viewBox="0 0 112 80" width="112" height="80">
  <!--
    Le monogramme CartePro : une carte de paiement — rectangle aux coins
    arrondis — dans laquelle sont évidés un C et une puce.

    Un seul `path`, un seul remplissage, `fill-rule="evenodd"` : la carte est
    le premier sous-chemin, le C et la puce sont les deux suivants, et la règle
    pair-impair les creuse au lieu de les peindre. Un tracé unique en une seule
    encre, donc — ce qui le rend imprimable dans n’importe quelle couleur, y
    compris celle que le salarié choisit pour sa carte.

    Géométrie : carte 112x80 (r 13), C centré en (41,40) — rayons 27 et 12,5,
    ouverture de 100° à droite —, puce 20x18 en (80,31). Lisible jusqu’à 16px.
    Toute retouche doit être reportée dans components/brand/VectorMark.tsx, qui
    porte le même tracé en ligne.
  -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M13 0 H99 A13 13 0 0 1 112 13 V67 A13 13 0 0 1 99 80 H13 A13 13 0 0 1 0 67 V13 A13 13 0 0 1 13 0 Z
           M58.36 19.32 A27 27 0 1 0 58.36 60.68 L49.03 49.57 A12.5 12.5 0 1 1 49.03 30.43 Z
           M83 31 H97 A3 3 0 0 1 100 34 V46 A3 3 0 0 1 97 49 H83 A3 3 0 0 1 80 46 V34 A3 3 0 0 1 83 31 Z"/>
</svg>
